[build-system]
requires = [ "poetry-core>=1.0.0",]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "comrun"
version = "0.1.0-dev"
description = "Simplified and configurable wrapper for Python's subprocess.Popen"
authors = [ "Yevhen Bondarenko <zekbond@gmail.com>",]
readme = "README.md"
[tool.ruff]
exclude = [ ".ci", ".idea",]

[tool.skjold]
report_only = false
sources = [ "pyup", "gemnasium",]

[tool.bandit]
exclude_dirs = [ ".ci", ".venv", "venv", "tests",]
skips = [ "B404",]

[tool.poetry.dependencies]
python = "^3.10"
rich = "^13.7.1"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "[%(asctime)s,%(msecs)03d] %(name)-40.40s %(levelname)s %(message)s"
addopts = "--color=yes"

[tool.poetry.group.test.dependencies]
pytest = "^7.4.2"
pytest-asyncio = "^0.23.8"

[tool.poetry.group.dev.dependencies]
ruff = "^0.5.1"
ruff-lsp = "^0.0.54"
icecream = "^2.1.3"
